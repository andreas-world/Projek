<!DOCTYPE html>
<html lang="id">
<head>
  <style>
    body {
      display: flex;
      justify-content: center;
      padding-top: 50px;
      background-color: #e705af;
    }

    .kotak {
      width: 100px;
      height: 100px;
      background-color: #3498db;
      color: rgb(255, 255, 255);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      font-weight: bold;
    }

    /* KOTAK 1: Menggunakan BORDER */
    .pakai-margin {
      border: 10px solid #2ecc71; /* Garis hijau 10px */
      margin: 22px;
    }

    /* KOTAK 2: Menggunakan OUTLINE */
    .pakai-padding {
      border: 10px solid #e74c3c; /* Garis merah 10px */
      padding: 20px
    }
  </style>
</head>
<body>

      <div class="kotak pakai-margin">margin</div>
  <div class="kotak pakai-padding">padding</div>


</body>
</html>
